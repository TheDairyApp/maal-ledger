<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maal Ledger — Cloud Pro</title>
  <!-- External Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Link to your modular stylesheet -->
  <link rel="stylesheet" href="styles/style.css">
  
  <!-- Link to your favicon (assuming it's in the root or assets folder) -->
  <link rel="icon" href="favicon.ico">
</head>
<body>

    <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="login-overlay">
    <div class="card login-card">
      <div class="brand" style="border: none; padding-bottom: 10px; text-align: center; color: var(--ink);">
        <h1 style="font-size: 24px;">Maal Ledger</h1>
        <p style="color: var(--muted);">Sign in to access your secure cloud</p>
      </div>
      
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="field full">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="gu*****@gmail.com">
        </div>
        <div class="field full">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
      </div>
      
      <div id="loginError" class="small red" style="text-align: center; margin-top: 10px; height: 15px;"></div>
      
      <button class="btn primary" onclick="handleLogin()" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 14px;">
        Sign In
      </button>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><h1>Maal Ledger</h1><p>Supabase Live Cloud</p></div>
<nav class="nav">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="customers">Customers</button>
        <button data-view="all">All Qists</button>
      </nav>
      <div class="side-search"><input id="searchBox" placeholder="Search customer..."></div>
      <div class="cust-list" id="custList"></div>

    <!-- Add this right before </aside> -->
    <div style="padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
      <button class="btn small" onclick="handleSignOut()" style="width: 100%; background: rgba(255,255,255,0.05); color: #fca5a5; border: 1px solid #fca5a555;">
        Sign Out
      </button>
    </div>
  
    </aside>
    <main class="main" id="main">
      <div class="loading-box">Connecting to Supabase...</div>
    </main>
  </div>

  <div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <!-- Your Modular Scripts (Order is critical!) -->
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
