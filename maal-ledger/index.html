<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maal Ledger — Cloud Pro</title>
<link rel="stylesheet" href="styles/style.css">
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <h1>Maal Ledger</h1>
      <p>Supabase Live Cloud</p>
      <div class="toggle-row">
        <button id="langToggle" class="btn small" onclick="toggleLanguage()">اردو</button>
        <button id="themeToggle" class="btn small" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
    <div class="side-search">
      <input id="searchBox" placeholder="Search clients...">
    </div>
    <div class="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="clients">Clients</button>
      <button data-view="all">All Qists</button>
      <button data-view="investors">Investors</button>
      <button data-view="cashbook">Cashbook</button>
    </div>
    <div class="cust-list" id="custList"></div>
  </div>

  <div class="main" id="main">
    <div class="loading-spinner">Connecting to Supabase...</div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
